name: LLM Probabilistic Evaluation & Regression Gate

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  statistical-regression-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Pytest Unit & Statistical Foundation Tests
        run: |
          pytest -v tests/

      - name: Run Continuous Regression Quality Gate
        run: |
          python -m probeval.cli compare \
            --benchmark structured_extraction \
            --regression-factor 0.05 \
            --samples 6 \
            --html reports/ci_regression_report.html

      - name: Upload HTML Benchmark Dashboard Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: probeval-regression-dashboard
          path: reports/*.html
